[project]
name = "bftune"
version = "0.2.0"
description = "Model-based Betaflight tuning: blackbox chirp system identification, alias-aware noise model and robust PID/filter optimization"
license = "GPL-3.0-or-later"
authors = [{ name = "LeonRein" }]
keywords = ["betaflight", "fpv", "drone", "pid", "tuning", "blackbox", "system-identification"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
bftune = "bftune.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B023", "B905"]  # P/I/D are domain names

[tool.pytest.ini_options]
markers = ["slow: long-running synthetic end-to-end tests"]
